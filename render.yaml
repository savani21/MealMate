services:
  - type: web
    name: mealmate-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_TIMEOUT_MS
        value: "75000"
      - key: OPENROUTER_MAX_TOKENS
        value: "9000"
      - key: OPENAI_API_KEY
        sync: false
      - key: USDA_FDC_API_KEY
        sync: false
